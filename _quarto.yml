    - spine.qmd
    - how-to-upload.qmd
    - progress.qmd
    - caveats.qmd
    - modules/*.qmd
    - members/*.qmd

website:
  title: "Programming group"
  repo-url: https://github.com/ivanpadezhki/programming-group
  navbar:
